name: contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install
        run: pip install jsonschema pytest

      - name: validate fixtures
        run: python contract/validate.py fixtures/*.json

      - name: validate data (if present)
        run: |
          shopt -s nullglob
          files=(data/*.json)
          if [ ${#files[@]} -gt 0 ]; then
            python contract/validate.py "${files[@]}"
          else
            echo "no data/*.json yet — skipping"
          fi

      - name: validate artifacts (if present)
        run: |
          shopt -s nullglob
          files=(artifacts/*.json)
          if [ ${#files[@]} -gt 0 ]; then
            python contract/validate.py "${files[@]}"
          else
            echo "no artifacts/*.json yet — skipping"
          fi

      - name: pytest
        run: pytest -q

      - name: candidate_rings.json is fresh (if present)
        run: |
          if [ -f artifacts/candidate_rings.json ] && [ -f data/entities.json ] && [ -f data/invoices.json ]; then
            cp artifacts/candidate_rings.json /tmp/committed_candidates.json
            python -m graph.run --entities data/entities.json --invoices data/invoices.json \
              --out artifacts/candidate_rings.json --max-depth 6
            diff -q /tmp/committed_candidates.json artifacts/candidate_rings.json || \
              (echo "::error::committed candidate_rings.json is stale — graph/ changed but the artifact wasn't regenerated. Run: python -m graph.run --entities data/entities.json --invoices data/invoices.json --out artifacts/candidate_rings.json --max-depth 6" && exit 1)
          else
            echo "candidate_rings.json or data/*.json not present yet — skipping freshness check"
          fi
